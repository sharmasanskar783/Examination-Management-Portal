{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="mb-3">Register</h3>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Full name</label>
            <input type="text" name="name" class="form-control" value="{{ request.form.get('name', '') }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" value="{{ request.form.get('email', '') }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password (at least 6 characters)</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">I am a</label>
            <select name="role" class="form-select" required>
              <option value="">-- choose --</option>
              <option value="student" {% if request.form.get('role') == 'student' %}selected{% endif %}>Student</option>
              <option value="examiner" {% if request.form.get('role') == 'examiner' %}selected{% endif %}>Examiner</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Department (optional)</label>
            <input type="text" name="department" class="form-control" value="{{ request.form.get('department', '') }}">
          </div>
          <div class="mb-3">
            <label class="form-label">Contact (optional)</label>
            <input type="text" name="contact" class="form-control" value="{{ request.form.get('contact', '') }}">
          </div>
          <button class="btn btn-primary w-100">Register</button>
        </form>
        <p class="mt-3 mb-0">Already registered? <a href="/login">Login</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
