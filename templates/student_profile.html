{% extends 'base.html' %}
{% block title %}Profile{% endblock %}
{% block content %}
<h3 class="mb-3">My profile</h3>
<form method="post" class="card card-body shadow-sm" style="max-width: 600px;">
  <div class="mb-3">
    <label class="form-label">Email (cannot be changed)</label>
    <input type="text" class="form-control" value="{{ current_user.email }}" disabled>
  </div>
  <div class="mb-3">
    <label class="form-label">Full name</label>
    <input type="text" name="name" class="form-control" value="{{ request.form.get('name', current_user.name) }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Department</label>
    <input type="text" name="department" class="form-control" value="{{ request.form.get('department', current_user.department or '') }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Contact</label>
    <input type="text" name="contact" class="form-control" value="{{ request.form.get('contact', current_user.contact or '') }}">
  </div>
  <div class="mb-3">
    <label class="form-label">New password (leave blank to keep the old one)</label>
    <input type="password" name="password" class="form-control">
  </div>
  <button class="btn btn-primary">Save profile</button>
</form>
{% endblock %}
